name: Build Android APK

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Essential Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git python3-dev unzip autoconf libtool pkg-config

    - name: Install Graphics and SDL Libraries
      run: |
        sudo apt-get install -y ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev

    - name: Install Java JDK 17
      run: |
        sudo apt-get install -y openjdk-17-jdk

    - name: Upgrade Pip and Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Build Android APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: package
        path: bin/*.apk
